# 본체 노트북 실기 테스트: 실제 본체 하드웨어(+센서)에서 공용 컨테이너로 빌드·테스트·통합 실행.
# "내 노트북에선 되는데 본체에선 안 됨" 을 병합 전에 잡기 위한 것.
#
# 준비(관리자 1회): 본체 노트북을 self-hosted runner 로 등록하고 라벨 `vehicle` 추가 (docs/TARGET_ENV.md)
# 실행: Actions → 본체 노트북 실기 테스트 → Run workflow → 테스트할 브랜치 선택
#   (쓰기 권한이 있는 팀원만 실행 가능. 외부 PR 에서는 실행되지 않음)
name: 본체 노트북 실기 테스트

on:
  workflow_dispatch:
    inputs:
      duration:
        description: 통합 실행 시간(초)
        default: "20"

concurrency:
  group: vehicle           # 본체는 하나 → 한 번에 하나씩
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  vehicle:
    runs-on: [self-hosted, linux, vehicle]
    timeout-minutes: 40
    env:
      DEV_NAME: anjabom-ci-${{ github.run_id }}
      DURATION: ${{ inputs.duration }}
    steps:
      - uses: actions/checkout@v5
      - name: 공용 이미지 최신화
        run: ./scripts/dev.sh --pull
      - name: 빌드 · 테스트 · 통합 실행 (컨테이너, 센서 연결)
        run: ./scripts/dev.sh --hw -- ./scripts/vehicle_test.sh "$DURATION"
      - name: 빌드 산출물 정리 (컨테이너가 만든 파일)
        if: always()
        run: ./scripts/dev.sh -- rm -rf build install log || true
