# 주간/월간 진행 리포트 → GitHub 이슈 + 노션 데이터베이스
# 노션 연동: Settings → Secrets and variables → Actions
#   Secret   NOTION_TOKEN        노션 통합(Integration) 토큰
#   Variable NOTION_DATABASE_ID  "작업 기록" 데이터베이스 ID
# 설정하지 않으면 GitHub 이슈만 만든다. (docs/NOTION.md)
name: 진행 리포트

on:
  schedule:
    - cron: "7 0 * * 1"    # 주간: 월요일 09:07 KST (지난주 월~일)
    - cron: "13 0 1 * *"   # 월간: 매월 1일 09:13 KST (지난달)
  workflow_dispatch:
    inputs:
      period:
        description: 리포트 종류
        type: choice
        options: [weekly, monthly]
        default: weekly

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        env:
          PERIOD: ${{ inputs.period || (github.event.schedule == '13 0 1 * *' && 'monthly' || 'weekly') }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        with:
          script: |
            const fs = require('fs');
            const report = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/report.js`);
            const cfg = JSON.parse(fs.readFileSync('.github/teams.json', 'utf8'));
            const period = report.periodFor(process.env.PERIOD);
            const data = await report.collect({ github, context, cfg, period });

            // GitHub 이슈 (같은 종류의 이전 리포트는 닫음)
            const label = period.kind === 'monthly' ? 'report:monthly' : 'report:weekly';
            const prev = await github.rest.issues.listForRepo({ ...context.repo, labels: label, state: 'open' });
            for (const p of prev.data) {
              await github.rest.issues.update({ ...context.repo, issue_number: p.number, state: 'closed', state_reason: 'completed' });
            }
            const { data: issue } = await github.rest.issues.create({
              ...context.repo, title: period.title, body: report.toMarkdown(data), labels: [label],
            });
            core.notice(`GitHub 리포트: ${issue.html_url}`);

            // 노션
            const { NOTION_TOKEN: token, NOTION_DATABASE_ID: databaseId } = process.env;
            if (!token || !databaseId) {
              core.warning('NOTION_TOKEN / NOTION_DATABASE_ID 가 없어 노션 기록을 건너뜁니다. (docs/NOTION.md)');
              return;
            }
            const url = await report.toNotion({ data, token, databaseId, reportUrl: issue.html_url });
            core.notice(`노션 기록: ${url}`);
