# 매주 월요일, 팀별 진행 상황 리포트를 이슈로 만든다.
# "누가 언제 무엇을 하고 있는지" 를 한 페이지로 보기 위함.
name: 주간 진행 리포트

on:
  schedule:
    - cron: "7 0 * * 1"   # 월요일 09:07 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const cfg = JSON.parse(fs.readFileSync('.github/teams.json', 'utf8'));
            const repo = `${context.repo.owner}/${context.repo.repo}`;
            const since = new Date(Date.now() - 7 * 86400000).toISOString().slice(0, 10);
            const today = new Date().toISOString().slice(0, 10);
            const search = async q => (await github.paginate(github.rest.search.issuesAndPullRequests, { q: `repo:${repo} ${q}`, per_page: 100 }));
            const who = i => (i.assignees?.length ? i.assignees : [i.user]).map(u => '`' + u.login + '`').join(', ');
            const line = i => `- [#${i.number}](${i.html_url}) ${i.title} - ${who(i)}`;
            const section = (title, items) => items.length ? `**${title}** (${items.length})\n${items.map(line).join('\n')}\n` : '';

            const merged = await search(`is:pr is:merged merged:>=${since}`);
            const openPrs = await search('is:pr is:open');
            const inProgress = await search('is:issue is:open label:status:in-progress');
            const blocked = await search('is:issue is:open label:status:blocked');
            const closedIssues = await search(`is:issue is:closed closed:>=${since}`);

            const groups = cfg.teams.map(t => ({ name: `${t.name} (${t.id})`, label: t.label }));
            groups.push({ name: '공용 / 팀 미지정', label: null });
            const teamLabels = cfg.teams.map(t => t.label);
            const pick = (items, label) => items.filter(i => {
              const names = i.labels.map(l => l.name);
              return label ? names.includes(label) : !names.some(n => teamLabels.includes(n));
            });

            let body = `## 📊 주간 진행 리포트 (${since} ~ ${today})\n\n` +
              `| 팀 | 병합된 PR | 완료 이슈 | 진행 중 | 막힘 | 열린 PR |\n|---|---|---|---|---|---|\n`;
            for (const g of groups) {
              body += `| ${g.name} | ${pick(merged, g.label).length} | ${pick(closedIssues, g.label).length} | ` +
                      `${pick(inProgress, g.label).length} | ${pick(blocked, g.label).length} | ${pick(openPrs, g.label).length} |\n`;
            }
            for (const g of groups) {
              const detail = section('✅ 병합된 PR', pick(merged, g.label)) +
                             section('🚧 진행 중 이슈', pick(inProgress, g.label)) +
                             section('⛔ 막힌 이슈', pick(blocked, g.label)) +
                             section('👀 열린 PR', pick(openPrs, g.label));
              if (detail) body += `\n### ${g.name}\n${detail}`;
            }
            body += `\n---\n_자동 생성 (.github/workflows/weekly-report.yml). 막힌 작업은 이번 주 회의에서 먼저 다뤄 주세요._`;

            const prev = await github.rest.issues.listForRepo({ ...context.repo, labels: 'report:weekly', state: 'open' });
            for (const p of prev.data) {
              await github.rest.issues.update({ ...context.repo, issue_number: p.number, state: 'closed', state_reason: 'completed' });
            }
            await github.rest.issues.create({ ...context.repo, title: `📊 주간 리포트 ${today}`, body, labels: ['report:weekly'] });
