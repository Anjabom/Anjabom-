# .github/labels.json (config/teams.yml 에서 생성) 의 라벨을 저장소에 생성/갱신한다.
name: 라벨 동기화

on:
  push:
    branches: [main]
    paths: [.github/labels.json]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v8
        with:
          script: |
            const labels = JSON.parse(require('fs').readFileSync('.github/labels.json', 'utf8'));
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, context.repo);
            const names = new Set(existing.map(l => l.name));
            for (const l of labels) {
              if (names.has(l.name)) {
                await github.rest.issues.updateLabel({ ...context.repo, name: l.name, color: l.color, description: l.description });
              } else {
                await github.rest.issues.createLabel({ ...context.repo, ...l });
                core.info(`생성: ${l.name}`);
              }
            }
            const unused = existing.filter(l => l.name.startsWith('team:') && !labels.some(x => x.name === l.name));
            if (unused.length) core.warning(`설정에 없는 팀 라벨: ${unused.map(l => l.name).join(', ')} (필요 없으면 GitHub 에서 직접 삭제/이름변경)`);
